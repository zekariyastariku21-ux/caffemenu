<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CaffeMenu | Cashier Sign In</title>
<style>
:root{color-scheme:dark;--bg:#17120f;--panel:#241b16;--gold:#d8ad62;--cream:#f8f0df;--muted:#b9aa98;--line:#49372b}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#392719,var(--bg) 65%);font-family:Arial,sans-serif;color:var(--cream);display:grid;place-items:center;padding:22px}
main{width:min(100%,420px);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:30px;box-shadow:0 18px 60px #0005}
.eyebrow{color:var(--gold);font-size:12px;font-weight:bold;letter-spacing:2px;text-transform:uppercase}h1{margin:12px 0 8px}p{color:var(--muted);line-height:1.5}label{display:block;margin:22px 0 8px;font-weight:bold}
input,select{width:100%;padding:15px;border:1px solid var(--line);border-radius:10px;background:#130f0d;color:var(--cream)}
input{font-size:22px;letter-spacing:8px;text-align:center}select{font-size:16px}
button{width:100%;margin-top:18px;border:0;border-radius:10px;padding:14px;background:var(--gold);color:#24170c;font-size:15px;font-weight:bold;cursor:pointer}button:disabled{opacity:.6;cursor:wait}#message{min-height:24px;color:var(--gold);font-size:14px}
</style>
</head>
<body><main>
<div class="eyebrow">CaffeMenu - Cashier</div>
<h1>Cashier sign in</h1>
<p id="restaurantLabel">Choose your branch and enter its cashier PIN.</p>
<form id="loginForm">
<label for="branch">Branch</label>
<select id="branch" required><option value="">Loading branches...</option></select>
<label for="pin">Branch PIN</label>
<input id="pin" type="password" inputmode="numeric" autocomplete="current-password" pattern="[0-9]{6,12}" minlength="6" maxlength="12" required>
<button type="submit">Sign In</button>
</form>
<p id="message" role="status"></p>
</main>
<script>
(function(){
 const pathParts=location.pathname.split('/').filter(Boolean);
 const pathSlug=pathParts.length===2&&pathParts[1]==='cashier-login'?pathParts[0]:'';
 const slug=(pathSlug||new URLSearchParams(location.search).get('restaurant')||'').trim();
 const form=document.getElementById('loginForm'),pin=document.getElementById('pin'),message=document.getElementById('message'),branch=document.getElementById('branch');
 if(!slug){message.textContent='Restaurant not identified. Open the cashier sign-in link supplied by your administrator.';form.querySelector('button').disabled=true;return;}
 document.getElementById('restaurantLabel').textContent='Restaurant: '+slug+'. Choose your branch and enter its 6\u201312 digit PIN.';
 fetch('/api/public/payment-branches/'+encodeURIComponent(slug),{cache:'no-store'})
   .then(r=>r.json())
   .then(d=>{
     const list=Array.isArray(d.branches)?d.branches:[];
     branch.replaceChildren(new Option(list.length?'Select your branch':'No branches available',''));
     list.forEach(b=>branch.appendChild(new Option(b.name,String(b.id))));
     const last=localStorage.getItem('cashierBranch:'+slug);
     if(last&&list.some(b=>String(b.id)===last))branch.value=last;
   })
   .catch(()=>{message.textContent='Unable to load branches. Refresh the page.';});
 form.addEventListener('submit',async e=>{
   e.preventDefault();
   if(!branch.value){message.textContent='Select your branch.';return;}
   if(!/^[0-9]{6,12}$/.test(pin.value)){message.textContent='Enter a valid 6\u201312 digit PIN.';return;}
   const button=form.querySelector('button');button.disabled=true;message.textContent='Signing in\u2026';
   try{
     const r=await fetch('/api/cashier/login/'+encodeURIComponent(slug),{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:pin.value,branch_id:Number(branch.value)}),cache:'no-store'});
     const d=await r.json();if(!r.ok)throw new Error(d.message||'Sign in failed.');
     localStorage.setItem('cashierBranch:'+slug,branch.value);
     location.href='/'+encodeURIComponent(slug)+'/cashier-orders';
   }catch(err){message.textContent=err.message;pin.value='';pin.focus();}finally{button.disabled=false;}
 });
})();
</script></body></html>
