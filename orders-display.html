<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Order Management</title>
  <style>
  :root {
    color-scheme: dark;
    --bg: #17120f;
    --panel: #241b16;
    --gold: #d8ad62;
    --cream: #f8f0df;
    --muted: #b9aa98;
    --line: #49372b;
    font-family: Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--cream);
    font-family: Arial, sans-serif;
    min-height: 100dvh;
  }

  main {
    max-width: 1100px;
    margin: auto;
    padding: 28px 18px;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--line);
  }

  .admin-title-group { display: flex; align-items: center; gap: 12px; }
  #branchSelectButton { width: 42px; height: 42px; padding: 0; border-radius: 50%; color: var(--gold); font-size: 24px; line-height: 1; }

  h1 { margin: 0; font-size: 22px; letter-spacing: .2px; }
  h3 { color: var(--gold); font-size: 17px; margin: 16px 0 0; }

  button {
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 11px 15px;
    cursor: pointer;
    background: #302116;
    color: var(--cream);
    font-weight: bold;
    transition: background .15s ease, transform .15s ease;
  }

  button:hover { background: #49301d; }
  button:active { transform: scale(.98); }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

  #message {
    color: var(--gold);
    min-height: 22px;
    margin: 18px 0;
  }

  #orders {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr));
    gap: 14px;
    align-items: start;
  }

  .order {
    min-width: 0;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 17px;
    overflow-wrap: anywhere;
    transition: border-color .15s ease;
  }

  .order:hover { border-color: #80643b; }

  .order-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
  }

  .order-head strong { font-size: 17px; line-height: 1.4; }

  .status {
    display: inline-block;
    flex-shrink: 0;
    background: #30251a;
    border: 1px solid #80643b;
    color: var(--gold);
    border-radius: 30px;
    padding: 5px 9px;
    font-size: 12px;
    white-space: nowrap;
    text-transform: capitalize;
  }

  .muted {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.6;
  }

  .order > p { margin: 9px 0; line-height: 1.5; font-size: 14px; }
  .order > p.muted { margin: 7px 0 14px; }

  .order-contact-table {
    width: 100%;
    margin: 10px 0;
    table-layout: fixed;
    border-collapse: collapse;
    color: var(--cream);
    font-size: 14px;
  }
  .order-contact-table td {
    padding: 5px 8px;
    border: 1px solid var(--line);
    text-align: left;
    overflow-wrap: anywhere;
  }

  .items {
    border-top: 1px solid var(--line);
    padding: 12px 0 0 20px;
    margin: 12px 0 0;
  }

  .items li {
    padding: 7px 0;
    font-size: 14px;
    line-height: 1.5;
  }

  .items li + li { border-top: 1px solid rgba(73, 55, 43, .55); }
  .items .muted { margin-top: 4px; }
  .order-customization,
  .admin-item-customization {
    margin-top: 6px;
    padding: 5px 9px;
    border-left: 2px solid var(--gold);
    border-radius: 0 7px 7px 0;
    background: rgba(216, 173, 98, .12);
    color: #ffe0b9;
    font-size: 14px;
    font-weight: 700;
    line-height: 1.5;
    overflow-wrap: anywhere;
  }

  .empty {
    grid-column: 1 / -1;
    background: var(--panel);
    border: 1px dashed var(--line);
    border-radius: 14px;
    padding: 30px;
    text-align: center;
    color: var(--muted);
  }

  @media (max-width: 520px) {
    main { padding: 20px 13px; }
    h1 { font-size: 19px; }
    .order { padding: 15px; }
    .order-head strong { font-size: 16px; }
    button { padding: 10px 12px; }
  }

/* Full-width layout for admin and cashier order displays */
html,
body {
    width: 100%;
    min-height: 100%;
    margin: 0;
}

body {
    overflow-x: hidden;
}

header {
    width: 100%;
    max-width: none;
    margin: 0;
    box-sizing: border-box;
    padding-left: clamp(16px, 2vw, 32px);
    padding-right: clamp(16px, 2vw, 32px);
}

main > header {
    width: calc(100% + 2 * clamp(16px, 2vw, 32px));
    margin-left: calc(-1 * clamp(16px, 2vw, 32px));
}

main {
    width: 100%;
    max-width: none;
    margin: 0;
    padding: clamp(16px, 2vw, 32px);
}

.orders {
    width: 100%;
    grid-template-columns: repeat(
        auto-fit,
        minmax(min(100%, 320px), 1fr)
    );
}

/* Order status filters */
.order-status-filters {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 14px;
    width: 100%;
    padding: 16px clamp(16px, 2vw, 32px);
    box-sizing: border-box;
}

.order-filter {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    min-width: 0;
    padding: 16px 12px;
    border: 1px solid var(--line, #49372b);
    border-radius: 12px;
    color: var(--cream, #f8f0df);
    background: var(--panel, #241b16);
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: border-color .2s, transform .2s;
}

.order-filter:hover {
    transform: translateY(-1px);
}

.order-filter[aria-pressed="true"] {
    background: #f4c96b !important;
    color: #26180d !important;
    border: 2px solid #ffe3a0 !important;
    outline: 3px solid #d8ad62;
    outline-offset: 2px;
    box-shadow: 0 0 0 3px rgba(244, 201, 107, 0.22),
                0 6px 18px rgba(0, 0, 0, 0.35);
    font-weight: 800;
    transform: translateY(-2px);
    opacity: 1;
    filter: none;
}

.order-filter[aria-pressed="false"] {
    opacity: 0.72;
    filter: saturate(0.7);
    box-shadow: none;
}

.pending-filter { border-bottom: 3px solid #4d9b68; }
.preparing-filter { border-bottom: 3px solid #c18a3b; }
.completed-filter { border-bottom: 3px solid #568bc0; }

.order-count {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 30px;
    min-height: 30px;
    padding: 0 7px;
    box-sizing: border-box;
    border-radius: 50px;
    color: #17120f;
    background: var(--gold, #d8ad62);
    font-size: 14px;
    font-weight: 800;
}

@media (max-width: 520px) {
    .order-status-filters {
        gap: 7px;
        padding-top: 12px;
        padding-bottom: 12px;
    }

    .order-filter {
        flex-direction: column;
        gap: 7px;
        padding: 12px 4px;
        font-size: 12px;
    }
}
.status-action {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-top: 12px;
  padding: 10px 16px;
  border: 0;
  border-radius: 8px;
  background: #76502f;
  color: #fff;
  font: inherit;
  font-weight: 600;
  cursor: pointer;
}
.status-action:hover { filter: brightness(1.08); }
.status-action:disabled { opacity: .6; cursor: wait; }
.order-actions { margin-top: 8px; }
</style>
<style>
.admin-overlay[hidden], .admin-menu[hidden] { display: none !important; }
.admin-tools-bar { position: relative; display: flex; align-items: center; gap: 8px; }
#adminMenuButton { font-size: 22px; line-height: 1; padding: 8px 14px; cursor: pointer; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--cream); }
.admin-menu { position: absolute; right: 0; top: calc(100% + 8px); min-width: 210px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 6px; z-index: 900; box-shadow: 0 12px 30px rgba(0,0,0,.45); }
.admin-menu button { display: block; width: 100%; text-align: left; padding: 11px 12px; background: transparent; border: 0; color: var(--cream); font-size: 15px; border-radius: 8px; cursor: pointer; }
.admin-menu button:hover { background: rgba(216,173,98,.15); }
.admin-overlay { position: fixed; inset: 0; z-index: 1000; background: var(--bg); overflow-y: auto; }
.admin-overlay-inner { max-width: 1100px; margin: 0 auto; padding: 18px; }
.admin-overlay-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.admin-overlay-head h2 { margin: 0; color: var(--gold); }
#adminOverlayClose { font-size: 28px; line-height: 1; padding: 4px 14px; cursor: pointer; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--cream); }
.admin-date-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 14px; }
.admin-date-bar button, .admin-date-bar input, .admin-date-bar select, .admin-search, .admin-detail-btn { padding: 9px 13px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--cream); font-size: 15px; cursor: pointer; }
.admin-date-bar label { color: var(--muted); font-size: 14px; font-weight: bold; }
.admin-search { width: 100%; box-sizing: border-box; margin-bottom: 14px; cursor: text; }
.admin-summary { border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; color: var(--cream); }
.admin-overlay .order { border: 1px solid var(--line); background: var(--panel); border-radius: 14px; padding: 16px; margin-bottom: 12px; color: var(--cream); }
.admin-overlay .order-head { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.admin-item-list { list-style: none; padding: 0; margin: 10px 0; }
.admin-item-list li { padding: 0 0 8px 0; }
.admin-item-row { display: flex; justify-content: space-between; gap: 12px; }
.admin-item-sub { font-size: 13px; }
.admin-customer { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.admin-customer-main { min-width: 0; overflow-wrap: anywhere; }
.admin-detail-btn { color: var(--gold); border-color: #80643b; white-space: nowrap; }
.admin-branch-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 0 0 14px; }
.admin-branch-bar label { color: var(--muted); font-size: 14px; font-weight: bold; }
.admin-branch-bar select, .admin-branch-bar input { min-width: 190px; padding: 10px 12px; border-radius: 9px; border: 1px solid var(--line); background: #302116; color: var(--cream); font-size: 15px; }
.admin-report-table-wrap { overflow-x: auto; }
.admin-report-table { width: 100%; border-collapse: collapse; background: var(--panel); }
.admin-report-table th, .admin-report-table td { padding: 11px 12px; border: 1px solid var(--line); text-align: left; }
.admin-report-table th { color: var(--gold); }
.admin-delete-btn { padding: 8px 12px; border-radius: 10px; border: 1px solid #8b3a3a; background: transparent; color: #ff8c8c; cursor: pointer; font-size: 14px; }
.admin-delete-btn:hover { background: rgba(255,90,90,.12); }
.delete-confirm-dialog { width: min(440px, calc(100% - 32px)); padding: 0; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); color: var(--cream); box-shadow: 0 24px 70px rgba(0,0,0,.65); }
.delete-confirm-dialog::backdrop { background: rgba(0,0,0,.72); backdrop-filter: blur(3px); }
.delete-confirm-content { padding: 24px; }
.delete-confirm-content h2 { margin: 0 0 10px; color: var(--cream); font-size: 21px; }
.delete-confirm-content p { margin: 0; color: var(--muted); line-height: 1.6; }
.delete-confirm-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px; }
.delete-confirm-actions button { min-width: 100px; }
.delete-confirm-cancel { background: transparent; }
.delete-confirm-submit { border-color: #b94b4b; background: #a93636; color: #fff; }
.delete-confirm-submit:hover { background: #c14343; }
.delete-pin-field { display: flex; gap: 8px; margin-top: 18px; }
.delete-pin-field input { flex: 1; min-width: 0; padding: 11px 12px; border: 1px solid var(--line); border-radius: 9px; background: #17120f; color: var(--cream); font: inherit; letter-spacing: .18em; }
.delete-pin-field input:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
.delete-pin-toggle { min-width: 74px; }
.delete-pin-error { min-height: 20px; margin-top: 7px !important; color: #ff9a9a !important; font-size: 13px; }
.delete-pin-dialog { width: min(440px, calc(100% - 32px)); padding: 0; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); color: var(--cream); box-shadow: 0 24px 70px rgba(0,0,0,.65); }
.delete-pin-dialog::backdrop { background: rgba(0,0,0,.72); backdrop-filter: blur(3px); }
.delete-pin-content { padding: 24px; }
.delete-pin-content h2 { margin: 0 0 10px; }
.delete-pin-content > p { margin: 0; color: var(--muted); line-height: 1.5; }
.delete-pin-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }
.delete-pin-actions button { min-width: 100px; }
.delete-pin-save { background: var(--gold); color: #24170c; border-color: var(--gold); }
.delete-confirm-spinner { display: inline-block; width: 18px; height: 18px; margin-right: 9px; vertical-align: middle; border: 2px solid rgba(248,240,223,.3); border-top-color: var(--gold); border-radius: 50%; animation: delete-spin .8s linear infinite; }
.delete-confirm-spinner[hidden] { display: none; }
@keyframes delete-spin { to { transform: rotate(360deg); } }
@media (max-width: 520px) {
  main > header { position: relative; }
  .admin-title-group {
    flex: 1 1 100%;
    min-width: 0;
    padding-right: 52px;
  }
  .admin-title-group > div { min-width: 0; }
  #adminMenuButton {
    position: absolute;
    top: 0;
    right: 0;
  }
  .admin-tools-bar {
    position: static;
    flex-wrap: wrap;
    justify-content: flex-end;
    width: 100%;
  }
  .admin-menu { top: 50px; right: 0; }
}
</style>
</head>
<body>
<dialog id="deleteConfirmDialog" class="delete-confirm-dialog" aria-labelledby="deleteConfirmTitle" aria-describedby="deleteConfirmMessage">
  <form id="deleteConfirmForm" class="delete-confirm-content">
    <h2 id="deleteConfirmTitle">Delete this order?</h2>
    <p id="deleteConfirmMessage">This action cannot be undone.</p>
    <label class="delete-pin-field" for="deleteConfirmPin">
      <input id="deleteConfirmPin" type="password" inputmode="numeric" pattern="[0-9]{4,12}" maxlength="12" autocomplete="off" placeholder="Enter your 4-12 digit PIN" aria-label="Delete PIN">
      <button type="button" class="delete-pin-toggle" data-pin-toggle="deleteConfirmPin" aria-pressed="false">Show</button>
    </label>
    <p id="deleteConfirmPinError" class="delete-pin-error" role="alert"></p>
    <div id="deleteConfirmProgress" class="muted" role="status" hidden><span class="delete-confirm-spinner" aria-hidden="true"></span>Deleting order, please wait...</div>
    <div class="delete-confirm-actions">
      <button type="button" id="deleteConfirmCancel" class="delete-confirm-cancel">Cancel</button>
      <button type="button" id="deleteConfirmSubmit" class="delete-confirm-submit">Delete order</button>
    </div>
  </form>
</dialog>
<dialog id="deletePinSetupDialog" class="delete-pin-dialog" aria-labelledby="deletePinSetupTitle">
  <form id="deletePinSetupForm" class="delete-pin-content">
    <h2 id="deletePinSetupTitle">Set your delete PIN</h2>
    <p>Set a personal 4-12 digit PIN. You’ll need it along with the confirmation prompt to delete orders.</p>
    <label class="delete-pin-field" for="deletePinSetupInput">
      <input id="deletePinSetupInput" type="password" inputmode="numeric" pattern="[0-9]{4,12}" maxlength="12" autocomplete="new-password" placeholder="New PIN" required>
      <button type="button" class="delete-pin-toggle" data-pin-toggle="deletePinSetupInput" aria-pressed="false">Show</button>
    </label>
    <label class="delete-pin-field" for="deletePinConfirmInput">
      <input id="deletePinConfirmInput" type="password" inputmode="numeric" pattern="[0-9]{4,12}" maxlength="12" autocomplete="new-password" placeholder="Confirm PIN" required>
      <button type="button" class="delete-pin-toggle" data-pin-toggle="deletePinConfirmInput" aria-pressed="false">Show</button>
    </label>
    <p id="deletePinSetupError" class="delete-pin-error" role="alert"></p>
    <div class="delete-pin-actions">
      <button type="button" id="deletePinSetupCancel">Cancel</button>
      <button type="submit" class="delete-pin-save">Save PIN</button>
    </div>
  </form>
</dialog>
<div id="adminOverlay" class="admin-overlay" hidden>
  <div class="admin-overlay-inner">
    <div class="admin-overlay-head">
      <h2 id="adminOverlayTitle">Order History</h2>
      <button type="button" id="adminOverlayClose" aria-label="Close">&times;</button>
    </div>
    <div id="adminOverlayBody"></div>
  </div>
</div>
<main>
  <header>
    <div class="admin-title-group">
      <button id="branchSelectButton" type="button" aria-label="Select branch" aria-expanded="false" aria-controls="branchPicker">&#10140;</button>
      <div>
        <h1 id="selectedBranchName">Loading cafe...</h1>
        <p id="restaurantName" class="muted" hidden></p>
      </div>
    </div>
    <div class="admin-tools-bar">
      <button id="refreshButton" type="button">Refresh orders</button>
      <button id="adminMenuButton" type="button" aria-label="Menu" aria-haspopup="true" aria-expanded="false">&#9776;</button>

        <button type="button" data-admin-view="history">&#128197; Order History</button>
        <button type="button" data-admin-view="removed">&#128465; Removed Orders</button>
        <button type="button" data-admin-view="report">&#128200; Sales Report</button>

  </header>
<nav class="order-status-filters" aria-label="Filter orders">
  <button type="button" class="order-filter pending-filter" data-filter="pending" aria-pressed="false">
    Pending <span class="order-count" data-count="pending">0</span>
  </button>
  <button type="button" class="order-filter preparing-filter" data-filter="preparing" aria-pressed="false">
    Preparing <span class="order-count" data-count="preparing">0</span>
  </button>
  <button type="button" class="order-filter ready-filter" data-filter="ready" aria-pressed="false">
    Ready <span class="order-count" data-count="ready">0</span>
  </button>
  <button type="button" class="order-filter completed-filter" data-filter="completed" aria-pressed="false">
    Completed <span class="order-count" data-count="completed">0</span>
  </button>
</nav>

  <p id="message" role="status">Loading orders...</p>
  <section id="orders" aria-live="polite"></section>
</main>
<script>
(() => {
  const token = localStorage.getItem('adminToken') || '';
  const slug = (
    localStorage.getItem('adminRestaurantSlug') ||
    localStorage.getItem('selectedRestaurantSlug') ||
    ''
  ).trim();

  const message = document.getElementById('message');
  const ordersContainer = document.getElementById('orders');
  const branchSelectButton = document.getElementById('branchSelectButton');

  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, character => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;',
      '"': '&quot;', "'": '&#39;'
    })[character]);
  }

  function formatDate(value) {
    const date = new Date(value);
    return Number.isNaN(date.getTime()) ? '' : date.toLocaleString();
  }

  function formatRemovedDate(value) {
    const date = new Date(value);
    return Number.isNaN(date.getTime()) ? '' : date.toLocaleString(undefined, {
      year: 'numeric',
      month: 'short',
      day: 'numeric',
      hour: 'numeric',
      minute: '2-digit',
      second: '2-digit',
      timeZone: 'Africa/Addis_Ababa'
    });
  }

  function statusActionMarkup(order) {
    const actions = {
      pending: ['preparing', 'Start Preparing'],
      preparing: ['ready', 'Mark Ready'],
      ready: ['completed', 'Complete Order']
    };
    const action = actions[String(order.status || 'pending').trim().toLowerCase()];
    if (!action) return '';

    return `<div class="order-actions">
      <button type="button" class="status-action"
        data-order-status-action="${action[0]}"
        data-order-id="${escapeHtml(order.id)}">${action[1]}</button>
    </div>`;
  }
  async function loadOrders() {
    if (!token || !slug) {
      message.textContent = 'Please sign in to the admin panel and select a restaurant first.';
      ordersContainer.replaceChildren();
      return;
    }

    message.textContent = 'Loading orders...';

    try {
      const response = await fetch(
        `/api/admin/orders/${encodeURIComponent(slug)}` + (sessionStorage.getItem('orderBranchId') ? '?branch_id=' + encodeURIComponent(sessionStorage.getItem('orderBranchId')) : ''),
        { headers: { Authorization: `Bearer ${token}` }, cache: 'no-store' }
      );
      const data = await response.json();

      if (!response.ok || data?.ok !== true) {
        throw new Error(data?.message || 'Unable to load orders.');
      }

      document.getElementById('restaurantName').textContent = data.restaurant.name;
      window.dispatchEvent(new CustomEvent('adminRestaurantNameLoaded', {
        detail: { name: data.restaurant.name }
      }));
      const statusOrder = { pending: 0, preparing: 1, ready: 2, completed: 3 };
      const orders = (Array.isArray(data.orders) ? [...data.orders] : []).sort((a, b) => {
        const statusA = String(a.status || 'pending').toLowerCase();
        const statusB = String(b.status || 'pending').toLowerCase();
        const groupDifference = (statusOrder[statusA] ?? 4) - (statusOrder[statusB] ?? 4);
        if (groupDifference) return groupDifference;

        const timestamp = order => {
          const status = String(order.status || 'pending').toLowerCase();
          const value = status === 'preparing' ? (order.preparing_at || order.created_at) :
            status === 'ready' ? (order.ready_at || order.preparing_at || order.created_at) :
            status === 'completed' ? (order.completed_at || order.ready_at || order.created_at) :
            order.created_at;
          return Date.parse(value || '') || 0;
        };

        const timeA = timestamp(a);
        const timeB = timestamp(b);
        return statusA === 'completed'

async function adminRequest(url, options) {
  const opts = options || {};
  const response = await fetch(url, Object.assign({ cache: 'no-store' }, opts, {
    headers: Object.assign({ Authorization: `Bearer ${token}` }, opts.headers || {})
  }));
  const data = await response.json().catch(() => ({}));
  if (!response.ok || data.ok !== true) {
    const error = new Error(data.message || 'Request failed.');
    error.code = data.code;
    throw error;
  }
  return data;
}
function pad2(n) { return String(n).padStart(2, '0'); }
function todayString() { const d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function shiftDate(value, days) {
  const p = value.split('-').map(Number);
  const d = new Date(p[0], p[1] - 1, p[2] + days);
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}
function formatMoney(value) { return (Math.round((Number(value) || 0) * 100) / 100) + ' ETB'; }

async function loadHistory() {
  const box = document.getElementById('historyResult');
  if (!box) return;
  box.innerHTML = '<p class="muted">Loading...</p>';
  try {
    const data = await adminRequest(`/api/admin/order-history/${encodeURIComponent(slug)}?date=${encodeURIComponent(historyDate)}${branchQuery('&')}`);
    if (adminView !== 'history') return;
    const orders = data.orders || [];
    if (!orders.length) { box.innerHTML = '<div class="empty">No orders on this day.</div>'; return; }
    const counts = { pending: 0, preparing: 0, ready: 0, completed: 0 };
    let total = 0;
    orders.forEach(o => {
      const s = String(o.status || 'pending').toLowerCase();
      if (s in counts) counts[s]++;
      total += Number(o.total) || 0;
    });
    box.innerHTML = `<div class="admin-summary"><strong>${orders.length}</strong> order(s) &middot; <strong>${formatMoney(total)}</strong> total
        <div class="muted">Pending ${counts.pending} &middot; Preparing ${counts.preparing} &middot; Ready ${counts.ready} &middot; Completed ${counts.completed}</div></div>`
      + orders.map(historyOrderMarkup).join('');

}

async function loadRemovedOrders() {

  if (!box) return;
  if (removedFromDate && removedToDate && removedFromDate > removedToDate) {
    box.innerHTML = '<p class="muted">The start date must be on or before the end date.</p>';
    return;
  }
  const requestId = ++removedRequestId;
  box.innerHTML = '<p class="muted">Loading removed orders...</p>';
  try {
    const params = new URLSearchParams({ page: String(removedPage) });
    if (adminBranchId) params.set('branch_id', adminBranchId);
    if (removedFromDate) params.set('from_date', removedFromDate);
    if (removedToDate) params.set('to_date', removedToDate);
    if (removedSearch.trim()) params.set('search', removedSearch.trim());
    if (removedStatus) params.set('status', removedStatus);
    if (removedOrderType) params.set('order_type', removedOrderType);
    const data = await adminRequest(`/api/admin/removed-orders/${encodeURIComponent(slug)}?${params}`);
    if (adminView !== 'removed' || requestId !== removedRequestId) return;
    const orders = Array.isArray(data.orders) ? data.orders : [];
    const pagination = data.pagination || { page: 1, page_count: 1, total: orders.length };
    removedPage = Number(pagination.page) || 1;

      : '';
    box.innerHTML = `<div class="admin-summary"><strong>${escapeHtml(pagination.total)}</strong> removed order(s)</div>` +
      (orders.length ? orders.map(order => historyOrderMarkup(order, true)).join('') : '<div class="empty">No removed orders match these filters.</div>') +

    if (adminView === 'removed' && requestId === removedRequestId) {
      box.innerHTML = `<p class="muted">${escapeHtml(error.message || 'Unable to load removed orders.')}</p>`;
    }

  currentCustomer = { key: key, name: name };
  adminOverlayTitle.textContent = (name || 'Customer') + ' - Orders';
  adminOverlayBody.innerHTML = `<div class="admin-date-bar"><button type="button" data-customer-back>&#8249; Back to customers</button></div><div id="customerOrdersResult"><p class="muted">Loading...</p></div>`;
  const box = document.getElementById('customerOrdersResult');
  try {
    const data = await adminRequest(`/api/admin/customers/${encodeURIComponent(slug)}/orders?key=${encodeURIComponent(key)}${branchQuery('&')}`);
    if (adminView !== 'customer-detail') return;
    const orders = data.orders || [];
    if (!orders.length) { box.innerHTML = '<div class="empty">No orders for this customer.</div>'; return; }
    const total = orders.reduce((sum, o) => sum + (Number(o.total) || 0), 0);
    box.innerHTML = `<div class="admin-summary"><strong>${orders.length}</strong> order(s) &middot; <strong>${formatMoney(total)}</strong> total</div>` + orders.map(historyOrderMarkup).join('');
  } catch (e) { box.innerHTML = `<p class="muted">${escapeHtml(e.message || 'Unable to load orders.')}</p>`; }
}

// ---- Customer Accounts module (accounts created from the customer menu) ----
async function showAccounts() {
  adminView = 'accounts';
  currentAccount = null;
  adminOverlayTitle.textContent = 'Customer Accounts';
  adminOverlayBody.innerHTML = '<p class="muted">Loading...</p>';
  await ensureAdminBranches();
  if (adminView !== 'accounts') return;
  const accountDateFilters = `<label for="accountFromDateInput">From</label><input type="date" id="accountFromDateInput" value="${escapeHtml(accountFromDate)}">
    <label for="accountToDateInput">To</label><input type="date" id="accountToDateInput" value="${escapeHtml(accountToDate)}">`;
  adminOverlayBody.innerHTML = branchFilterMarkup(accountDateFilters) + `<input type="search" id="accountSearchInput" class="admin-search" placeholder="Search name or phone" value="${escapeHtml(accountSearch)}"><div id="accountResult"><p class="muted">Loading...</p></div>`;
  try {
    const params = new URLSearchParams();
    if (adminBranchId) params.set('branch_id', adminBranchId);
    if (accountFromDate) params.set('from_date', accountFromDate);
    if (accountToDate) params.set('to_date', accountToDate);
    const query = params.toString();
    const data = await adminRequest(`/api/admin/customer-accounts/${encodeURIComponent(slug)}${query ? '?' + query : ''}`);
    if (adminView !== 'accounts') return;
    accountCache = data.accounts || [];
    accountTotal = Number(data.total_accounts) || 0;
    renderAccounts();
  } catch (e) {
    const box = document.getElementById('accountResult');
    if (box) box.innerHTML = `<p class="muted">${escapeHtml(e.message || 'Unable to load customer accounts.')}</p>`;
  }
}
function renderAccounts() {
  const box = document.getElementById('accountResult');
  if (!box) return;
  const q = accountSearch.trim().toLowerCase();
  const list = accountCache.filter(a => !q || [a.full_name, a.phone].join(' ').toLowerCase().includes(q));
  if (!list.length) { box.innerHTML = `<div class="empty">${accountTotal ? 'No accounts found.' : 'No customer accounts have been created yet.'}</div>`; return; }
  box.innerHTML = `<p class="muted">${list.length} account(s)${adminBranchId ? ' with orders at this branch' : ''} &middot; ${accountTotal} matching account(s)</p>` + list.map(a => `
    <article class="order admin-customer">
      <div class="admin-customer-main">
        <strong>${escapeHtml(a.full_name || 'Unknown')}</strong>
        <div>${escapeHtml(a.phone || '')}</div>
        <div class="muted">Joined ${escapeHtml(formatDate(a.created_at))}${a.last_login_at ? ' &middot; Last login ' + escapeHtml(formatDate(a.last_login_at)) : ''}</div>
        <div class="muted">${escapeHtml(a.order_count)} order(s) &middot; ${formatMoney(a.total_spent)}${a.last_order_at ? ' &middot; Last order ' + escapeHtml(formatDate(a.last_order_at)) : ''}</div>
      </div>
      <button type="button" class="admin-detail-btn" data-account-id="${escapeHtml(a.id)}" data-account-name="${escapeHtml(a.full_name || '')}">Orders</button>
    </article>`).join('');
}
async function showAccountOrders(id, name) {
  adminView = 'account-detail';
  currentAccount = { id: id, name: name };
  adminOverlayTitle.textContent = (name || 'Customer') + ' - Orders';
  adminOverlayBody.innerHTML = `<div class="admin-date-bar"><button type="button" data-account-back>&#8249; Back to accounts</button></div><div id="accountOrdersResult"><p class="muted">Loading...</p></div>`;
  const box = document.getElementById('accountOrdersResult');
  try {
    const data = await adminRequest(`/api/admin/customer-accounts/${encodeURIComponent(slug)}/${encodeURIComponent(id)}/orders${branchQuery('?')}`);
    if (adminView !== 'account-detail') return;
    const orders = data.orders || [];
    if (!orders.length) { box.innerHTML = '<div class="empty">No orders for this customer.</div>'; return; }
    const total = orders.reduce((sum, o) => sum + (Number(o.total) || 0), 0);
    box.innerHTML = `<div class="admin-summary"><strong>${orders.length}</strong> order(s) &middot; <strong>${formatMoney(total)}</strong> total</div>` + orders.map(historyOrderMarkup).join('');
  } catch (e) { box.innerHTML = `<p class="muted">${escapeHtml(e.message || 'Unable to load orders.')}</p>`; }
}

function confirmDeleteOrder(number) {
  deleteConfirmTitle.textContent = 'Delete this order?';
  deleteConfirmMessage.textContent = `Are you sure you want to permanently delete order #${number}? This action cannot be undone.`;
  deleteConfirmMessage.hidden = false;
  deleteConfirmPin.value = '';
  deleteConfirmPinError.textContent = '';
  deleteConfirmProgress.hidden = true;
  deleteConfirmActions.hidden = false;
  deleteConfirmDialog.returnValue = '';
  return new Promise(resolve => {
    deleteConfirmDialog.addEventListener('close', () => {
      resolve({
        confirmed: deleteConfirmDialog.returnValue === 'confirm',
        pin: deleteConfirmPin.value
      });
    }, { once: true });
    deleteConfirmDialog.showModal();
    deleteConfirmPin.focus();
  });
}

function approveOrderDeletion(event) {
  if (event) event.preventDefault();
  if (!/^\d{4,12}$/.test(deleteConfirmPin.value)) {
    deleteConfirmPinError.textContent = 'Enter your 4-12 digit delete PIN.';
    deleteConfirmPin.focus();
    return;
  }
  deleteConfirmDialog.close('confirm');
}

deleteConfirmCancel.addEventListener('click', () => deleteConfirmDialog.close('cancel'));
deleteConfirmSubmit.addEventListener('click', approveOrderDeletion);
deleteConfirmForm.addEventListener('submit', approveOrderDeletion);
deleteConfirmPin.addEventListener('keydown', event => {
  if (event.key === 'Enter') approveOrderDeletion(event);
});

function openDeletePinSetup(message) {
  deletePinSetupForm.reset();
  deletePinSetupError.textContent = message || '';
  deletePinSetupDialog.showModal();
  deletePinSetupInput.focus();
}

deletePinSetupForm.addEventListener('submit', async event => {
  event.preventDefault();
  const pin = deletePinSetupInput.value;
  if (!/^\d{4,12}$/.test(pin)) {
    deletePinSetupError.textContent = 'PIN must contain 4 to 12 digits.';
    deletePinSetupInput.focus();
    return;
  }
  if (pin !== deletePinConfirmInput.value) {
    deletePinSetupError.textContent = 'The PIN entries do not match.';
    deletePinConfirmInput.focus();
    return;
  }

  const submitButton = deletePinSetupForm.querySelector('button[type="submit"]');
  deletePinSaving = true;
  submitButton.disabled = true;
  deletePinSetupError.textContent = 'Saving PIN...';
  try {
    await adminRequest(`/api/admin/order-delete-pin/${encodeURIComponent(slug)}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pin })
    });
    deletePinSetupDialog.close('saved');
  } catch (error) {
    deletePinSetupError.textContent = error.message || 'Unable to save delete PIN.';
  } finally {
    deletePinSaving = false;
    submitButton.disabled = false;
  }
});

document.getElementById('deletePinSetupCancel').addEventListener('click', () => {
  deletePinSetupDialog.close('cancel');
});
deletePinSetupDialog.addEventListener('cancel', event => {
  if (deletePinSaving) event.preventDefault();
});
document.addEventListener('click', event => {
  const toggle = event.target.closest('button[data-pin-toggle]');
  if (!toggle) return;
  const input = document.getElementById(toggle.dataset.pinToggle);
  if (!input) return;
  const showing = input.type === 'password';
  input.type = showing ? 'text' : 'password';
  toggle.textContent = showing ? 'Hide' : 'Show';
  toggle.setAttribute('aria-pressed', String(showing));
});

function showDeletingOrder(number) {
  deleteInProgress = true;
  deleteConfirmTitle.textContent = 'Deleting order...';
  deleteConfirmMessage.textContent = `Order #${number} is being deleted.`;
  deleteConfirmProgress.hidden = false;
  deleteConfirmActions.hidden = true;
  deleteConfirmDialog.showModal();
}

function hideDeletingOrder() {
  deleteInProgress = false;
  deleteConfirmDialog.close();
  deleteConfirmTitle.textContent = 'Delete this order?';
  deleteConfirmMessage.hidden = false;
  deleteConfirmProgress.hidden = true;
  deleteConfirmActions.hidden = false;
}

deleteConfirmDialog.addEventListener('cancel', event => {
  if (deleteInProgress) event.preventDefault();
});

async function deleteOrder(id, number) {
  const confirmation = await confirmDeleteOrder(number);
  if (!confirmation.confirmed) return;
  showDeletingOrder(number);
  let deleteError = null;
  try {
    await adminRequest(`/api/admin/orders/${encodeURIComponent(slug)}/${encodeURIComponent(id)}`, {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pin: confirmation.pin })
    });
    await loadOrders();
    message.textContent = `Order #${number} deleted.`;
    if (!adminOverlay.hidden) {
      if (adminView === 'history') await loadHistory();
      else if (adminView === 'customer-detail' && currentCustomer) await showCustomerOrders(currentCustomer.key, currentCustomer.name);
      else if (adminView === 'account-detail' && currentAccount) await showAccountOrders(currentAccount.id, currentAccount.name);
    }
  } catch (e) {
    deleteError = e;
  } finally {
    hideDeletingOrder();
  }
  if (deleteError) {
    if (deleteError.code === 'delete_pin_not_configured') {
      openDeletePinSetup('Set your PIN before deleting orders, then try again.');
    } else {
      window.alert(deleteError.message || 'Unable to delete the order.');
    }
  }
}

adminMenuButton.addEventListener('click', e => { e.stopPropagation(); setMenu(adminMenu.hidden); });
document.addEventListener('click', e => { if (!adminMenu.hidden && !adminMenu.contains(e.target)) setMenu(false); });
adminMenu.addEventListener('click', e => {
  const action = e.target.closest('button[data-admin-action]');
  if (action?.dataset.adminAction === 'delete-pin') {
    setMenu(false);
    openDeletePinSetup();
    return;
  }
  const b = e.target.closest('button[data-admin-view]');
  if (!b) return;
  setMenu(false);
  const view = b.dataset.adminView;
  if (view === 'live') { if (!adminOverlay.hidden) closeOverlay(); return; }
  openOverlay();
  if (view === 'history') showHistory();
  else if (view === 'removed') showRemovedOrders();
  else if (view === 'report') showSalesReport();
  else if (view === 'accounts') showAccounts();
  else showCustomers();
});
document.getElementById('adminOverlayClose').addEventListener('click', closeOverlay);
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!adminMenu.hidden) setMenu(false); else if (!adminOverlay.hidden) closeOverlay();
});
ordersContainer.addEventListener('click', e => {
  const del = e.target.closest('button[data-delete-order]');
  if (del) {
    del.disabled = true;
    deleteOrder(del.dataset.deleteOrder, del.dataset.orderNumber)
      .catch(error => window.alert(error.message || 'Unable to delete the order.'))
      .finally(() => { del.disabled = false; });
  }
});
adminOverlay.addEventListener('click', e => {
  const del = e.target.closest('button[data-delete-order]');
  if (del) {
    del.disabled = true;
    deleteOrder(del.dataset.deleteOrder, del.dataset.orderNumber)
      .catch(error => window.alert(error.message || 'Unable to delete the order.'))
      .finally(() => { del.disabled = false; });
    return;
  }
  const shift = e.target.closest('button[data-history-shift]');
  if (shift) {
    historyDate = shiftDate(historyDate || todayString(), Number(shift.dataset.historyShift));
    const input = document.getElementById('historyDateInput'); if (input) input.value = historyDate;
    loadHistory(); return;
  }
  if (e.target.closest('button[data-history-today]')) {
    historyDate = todayString();
    const input = document.getElementById('historyDateInput'); if (input) input.value = historyDate;
    loadHistory(); return;
  }
  const detail = e.target.closest('button[data-customer-key]');
  if (detail) { showCustomerOrders(detail.dataset.customerKey, detail.dataset.customerName); return; }
  if (e.target.closest('button[data-customer-back]')) { showCustomers(); return; }
  const acct = e.target.closest('button[data-account-id]');
  if (acct) { showAccountOrders(acct.dataset.accountId, acct.dataset.accountName); return; }
  if (e.target.closest('button[data-account-back]')) showAccounts();
  if (e.target.closest('button[data-report-run]')) {
    reportFromDate = document.getElementById('reportFromDateInput')?.value || '';
    reportToDate = document.getElementById('reportToDateInput')?.value || '';
    loadSalesReport();
  }
  if (e.target.closest('button[data-removed-run]')) {
    removedFromDate = document.getElementById('removedFromDateInput')?.value || '';
    removedToDate = document.getElementById('removedToDateInput')?.value || '';
    removedSearch = document.getElementById('removedSearchInput')?.value || '';
    removedStatus = document.getElementById('removedStatusSelect')?.value || '';
    removedOrderType = document.getElementById('removedOrderTypeSelect')?.value || '';
    removedPage = 1;
    loadRemovedOrders();
    return;
  }
  if (e.target.closest('button[data-removed-clear]')) {
    removedFromDate = '';
    removedToDate = '';
    removedSearch = '';
    removedStatus = '';
    removedOrderType = '';
    removedPage = 1;
    adminBranchId = '';
    sessionStorage.setItem('adminBranchFilter', '');
    showRemovedOrders();
    return;
  }
  const removedPageButton = e.target.closest('button[data-removed-page]');
  if (removedPageButton && !removedPageButton.disabled) {
    removedPage = Number(removedPageButton.dataset.removedPage) || 1;
    loadRemovedOrders();
  }
});
adminOverlay.addEventListener('change', e => {
  if (e.target.id === 'adminBranchSelect') { onBranchFilterChange(e.target.value); return; }
  if (e.target.id === 'historyDateInput' && e.target.value) { historyDate = e.target.value; loadHistory(); }
  if (e.target.id === 'accountFromDateInput') { accountFromDate = e.target.value; showAccounts(); }
  if (e.target.id === 'accountToDateInput') { accountToDate = e.target.value; showAccounts(); }
  if (e.target.id === 'reportFromDateInput') reportFromDate = e.target.value;
  if (e.target.id === 'reportToDateInput') reportToDate = e.target.value;
  if (e.target.id === 'removedFromDateInput') {
    removedFromDate = e.target.value;
    removedPage = 1;
    loadRemovedOrders();
  }
  if (e.target.id === 'removedToDateInput') {
    removedToDate = e.target.value;
    removedPage = 1;
    loadRemovedOrders();
  }
  if (e.target.id === 'removedStatusSelect') {
    removedStatus = e.target.value;
    removedPage = 1;
    loadRemovedOrders();
  }
  if (e.target.id === 'removedOrderTypeSelect') {
    removedOrderType = e.target.value;
    removedPage = 1;
    loadRemovedOrders();
  }
});
adminOverlay.addEventListener('input', e => {
  if (e.target.id === 'customerSearchInput') { customerSearch = e.target.value; renderCustomers(); }
  if (e.target.id === 'accountSearchInput') { accountSearch = e.target.value; renderAccounts(); }
  if (e.target.id === 'removedSearchInput') removedSearch = e.target.value;
});
  loadOrders();
  if (new URLSearchParams(location.search).get('view') === 'removed') {
    openOverlay();
    showRemovedOrders();
  }
})();
</script>
<script>
(function () {
  const filters = document.querySelectorAll(".order-filter");
  const orders = document.getElementById("orders");
  if (!orders || !filters.length) return;

  const filterStorageKey = "caffemenu-order-filter:" + location.pathname;
  let activeFilter = "pending";

  try {
    const savedFilter = localStorage.getItem(filterStorageKey);
    if (["all", "pending", "preparing", "ready", "completed"].includes(savedFilter)) {
      activeFilter = savedFilter;
    }
  } catch (_) {}

  function statusGroup(card) {
    const statusNode = card.querySelector(".status");
    const status = (statusNode ? statusNode.textContent : "")
      .trim().toLowerCase().replace(/[\s-]+/g, "_");

    if (status === "pending") {
      return "pending";
    }

    if (["preparing", "in_progress", "processing", "cooking"].includes(status)) {
      return "preparing";
    }

    if (["ready", "prepared"].includes(status)) {
      return "ready";
    }

    if (["completed", "complete", "delivered", "served", "done"].includes(status)) {
      return "completed";
    }

    return "other";
  }

  function updateFilters() {
    const cards = Array.from(orders.querySelectorAll(".order"));

    const counts = { pending: 0, preparing: 0, ready: 0, completed: 0 };

    cards.forEach(card => {
      const group = statusGroup(card);
      if (Object.prototype.hasOwnProperty.call(counts, group)) {
        counts[group]++;
      }

      card.hidden = activeFilter !== "all" && group !== activeFilter;
    });

    filters.forEach(button => {
      const group = button.dataset.filter;
      const count = button.querySelector("[data-count]");
      if (count) count.textContent = String(counts[group] || 0);
      button.setAttribute("aria-pressed", String(activeFilter === group));
    });
  }

  filters.forEach(button => {
    button.addEventListener("click", function () {
      activeFilter = button.dataset.filter;
      try {
        localStorage.setItem(filterStorageKey, activeFilter);
      } catch (_) {}
      updateFilters();
    });
  });

  new MutationObserver(updateFilters).observe(orders, {
    childList: true,
    subtree: true,
    characterData: true
  });

  updateFilters();
})();
</script>
