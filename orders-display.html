<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Order Management</title>
  <style>
  :root {
    color-scheme: dark;
    --bg: #17120f;
    --panel: #241b16;
    --gold: #d8ad62;
    --cream: #f8f0df;
    --muted: #b9aa98;
    --line: #49372b;
    font-family: Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--cream);
    font-family: Arial, sans-serif;
    min-height: 100vh;
  }

  main {
    max-width: 1100px;
    margin: auto;
    padding: 28px 18px;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--line);
  }

  h1 { margin: 0; font-size: 22px; letter-spacing: .2px; }
  h3 { color: var(--gold); font-size: 17px; margin: 16px 0 0; }

  button {
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 11px 15px;
    cursor: pointer;
    background: #302116;
    color: var(--cream);
    font-weight: bold;
    transition: background .15s ease, transform .15s ease;
  }

  button:hover { background: #49301d; }
  button:active { transform: scale(.98); }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

  #message {
    color: var(--gold);
    min-height: 22px;
    margin: 18px 0;
  }

  #orders {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr));
    gap: 14px;
    align-items: start;
  }

  .order {
    min-width: 0;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 17px;
    overflow-wrap: anywhere;
    transition: border-color .15s ease;
  }

  .order:hover { border-color: #80643b; }

  .order-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
  }

  .order-head strong { font-size: 17px; line-height: 1.4; }

  .status {
    display: inline-block;
    flex-shrink: 0;
    background: #30251a;
    border: 1px solid #80643b;
    color: var(--gold);
    border-radius: 30px;
    padding: 5px 9px;
    font-size: 12px;
    white-space: nowrap;
    text-transform: capitalize;
  }

  .muted {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.6;
  }

  .order > p { margin: 9px 0; line-height: 1.5; font-size: 14px; }
  .order > p.muted { margin: 7px 0 14px; }

  .items {
    border-top: 1px solid var(--line);
    padding: 12px 0 0 20px;
    margin: 12px 0 0;
  }

  .items li {
    padding: 7px 0;
    font-size: 14px;
    line-height: 1.5;
  }

  .items li + li { border-top: 1px solid rgba(73, 55, 43, .55); }
  .items .muted { margin-top: 4px; }

  .empty {
    grid-column: 1 / -1;
    background: var(--panel);
    border: 1px dashed var(--line);
    border-radius: 14px;
    padding: 30px;
    text-align: center;
    color: var(--muted);
  }

  @media (max-width: 520px) {
    main { padding: 20px 13px; }
    h1 { font-size: 19px; }
    .order { padding: 15px; }
    .order-head strong { font-size: 16px; }
    button { padding: 10px 12px; }
  }

/* Full-width layout for admin and cashier order displays */
html,
body {
    width: 100%;
    min-height: 100%;
    margin: 0;
}

body {
    overflow-x: hidden;
}

header {
    width: 100%;
    max-width: none;
    margin: 0;
    box-sizing: border-box;
    padding-left: clamp(16px, 2vw, 32px);
    padding-right: clamp(16px, 2vw, 32px);
}

main > header {
    width: calc(100% + 2 * clamp(16px, 2vw, 32px));
    margin-left: calc(-1 * clamp(16px, 2vw, 32px));
}

main {
    width: 100%;
    max-width: none;
    margin: 0;
    padding: clamp(16px, 2vw, 32px);
}

.orders {
    width: 100%;
    grid-template-columns: repeat(
        auto-fit,
        minmax(min(100%, 320px), 1fr)
    );
}

/* Order status filters */
.order-status-filters {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 14px;
    width: 100%;
    padding: 16px clamp(16px, 2vw, 32px);
    box-sizing: border-box;
}

.order-filter {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    min-width: 0;
    padding: 16px 12px;
    border: 1px solid var(--line, #49372b);
    border-radius: 12px;
    color: var(--cream, #f8f0df);
    background: var(--panel, #241b16);
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: border-color .2s, transform .2s;
}

.order-filter:hover {
    transform: translateY(-1px);
}

.order-filter[aria-pressed="true"] {
    background: #f4c96b !important;
    color: #26180d !important;
    border: 2px solid #ffe3a0 !important;
    outline: 3px solid #d8ad62;
    outline-offset: 2px;
    box-shadow: 0 0 0 3px rgba(244, 201, 107, 0.22),
                0 6px 18px rgba(0, 0, 0, 0.35);
    font-weight: 800;
    transform: translateY(-2px);
    opacity: 1;
    filter: none;
}

.order-filter[aria-pressed="false"] {
    opacity: 0.72;
    filter: saturate(0.7);
    box-shadow: none;
}

.pending-filter { border-bottom: 3px solid #4d9b68; }
.preparing-filter { border-bottom: 3px solid #c18a3b; }
.completed-filter { border-bottom: 3px solid #568bc0; }

.order-count {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 30px;
    min-height: 30px;
    padding: 0 7px;
    box-sizing: border-box;
    border-radius: 50px;
    color: #17120f;
    background: var(--gold, #d8ad62);
    font-size: 14px;
    font-weight: 800;
}

@media (max-width: 520px) {
    .order-status-filters {
        gap: 7px;
        padding-top: 12px;
        padding-bottom: 12px;
    }

    .order-filter {
        flex-direction: column;
        gap: 7px;
        padding: 12px 4px;
        font-size: 12px;
    }
}
.status-action {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-top: 12px;
  padding: 10px 16px;
  border: 0;
  border-radius: 8px;
  background: #76502f;
  color: #fff;
  font: inherit;
  font-weight: 600;
  cursor: pointer;
}
.status-action:hover { filter: brightness(1.08); }
.status-action:disabled { opacity: .6; cursor: wait; }
.order-actions { margin-top: 8px; }
</style>
<style>
.admin-overlay[hidden], .admin-menu[hidden] { display: none !important; }
.admin-tools-bar { position: relative; display: flex; align-items: center; gap: 8px; }
#adminMenuButton { font-size: 22px; line-height: 1; padding: 8px 14px; cursor: pointer; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--cream); }
.admin-menu { position: absolute; right: 0; top: calc(100% + 8px); min-width: 210px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 6px; z-index: 900; box-shadow: 0 12px 30px rgba(0,0,0,.45); }
.admin-menu button { display: block; width: 100%; text-align: left; padding: 11px 12px; background: transparent; border: 0; color: var(--cream); font-size: 15px; border-radius: 8px; cursor: pointer; }
.admin-menu button:hover { background: rgba(216,173,98,.15); }
.admin-overlay { position: fixed; inset: 0; z-index: 1000; background: var(--bg); overflow-y: auto; }
.admin-overlay-inner { max-width: 1100px; margin: 0 auto; padding: 18px; }
.admin-overlay-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.admin-overlay-head h2 { margin: 0; color: var(--gold); }
#adminOverlayClose { font-size: 28px; line-height: 1; padding: 4px 14px; cursor: pointer; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--cream); }
.admin-date-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 14px; }
.admin-date-bar button, .admin-date-bar input, .admin-search, .admin-detail-btn { padding: 9px 13px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--cream); font-size: 15px; cursor: pointer; }
.admin-search { width: 100%; box-sizing: border-box; margin-bottom: 14px; cursor: text; }
.admin-summary { border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; color: var(--cream); }
.admin-overlay .order { border: 1px solid var(--line); background: var(--panel); border-radius: 14px; padding: 16px; margin-bottom: 12px; color: var(--cream); }
.admin-overlay .order-head { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.admin-item-list { list-style: none; padding: 0; margin: 10px 0; }
.admin-item-list li { padding: 0 0 8px 0; }
.admin-item-row { display: flex; justify-content: space-between; gap: 12px; }
.admin-item-sub { font-size: 13px; }
.admin-customer { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.admin-customer-main { min-width: 0; overflow-wrap: anywhere; }
.admin-detail-btn { color: var(--gold); border-color: #80643b; white-space: nowrap; }
.admin-delete-btn { padding: 8px 12px; border-radius: 10px; border: 1px solid #8b3a3a; background: transparent; color: #ff8c8c; cursor: pointer; font-size: 14px; }
.admin-delete-btn:hover { background: rgba(255,90,90,.12); }
@media (max-width: 520px) { .admin-tools-bar { flex-wrap: wrap; justify-content: flex-end; } }
</style>
</head>
<body>
<div id="adminOverlay" class="admin-overlay" hidden>
  <div class="admin-overlay-inner">
    <div class="admin-overlay-head">
      <h2 id="adminOverlayTitle">Order History</h2>
      <button type="button" id="adminOverlayClose" aria-label="Close">&times;</button>
    </div>
    <div id="adminOverlayBody"></div>
  </div>
</div>
<main>
  <header>
    <div>
      <h1>Customer Orders</h1>
      <p id="restaurantName" class="muted">Loading restaurant...</p>
    </div>
    <div class="admin-tools-bar">
      <button id="refreshButton" type="button">Refresh orders</button>
      <button id="adminMenuButton" type="button" aria-label="Menu" aria-haspopup="true" aria-expanded="false">&#9776;</button>
      <div id="adminMenu" class="admin-menu" hidden>
        <button type="button" data-admin-view="live">&#128203; Live Orders</button>
        <button type="button" data-admin-view="history">&#128197; Order History</button>
        <button type="button" data-admin-view="customers">&#128101; Customers</button>
      </div>
    </div>
  </header>
<nav class="order-status-filters" aria-label="Filter orders">
  <button type="button" class="order-filter pending-filter" data-filter="pending" aria-pressed="false">
    Pending <span class="order-count" data-count="pending">0</span>
  </button>
  <button type="button" class="order-filter preparing-filter" data-filter="preparing" aria-pressed="false">
    Preparing <span class="order-count" data-count="preparing">0</span>
  </button>
  <button type="button" class="order-filter ready-filter" data-filter="ready" aria-pressed="false">
    Ready <span class="order-count" data-count="ready">0</span>
  </button>
  <button type="button" class="order-filter completed-filter" data-filter="completed" aria-pressed="false">
    Completed <span class="order-count" data-count="completed">0</span>
  </button>
</nav>

  <div id="branchPicker"></div>
  <p id="message" role="status">Loading orders...</p>
  <section id="orders" aria-live="polite"></section>
</main>
<script>
(() => {
  const token = localStorage.getItem('adminToken') || '';
  const slug = (
    localStorage.getItem('adminRestaurantSlug') ||
    localStorage.getItem('selectedRestaurantSlug') ||
    ''
  ).trim();

  const message = document.getElementById('message');
  const ordersContainer = document.getElementById('orders');

  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, character => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;',
      '"': '&quot;', "'": '&#39;'
    })[character]);
  }

  function formatDate(value) {
    const date = new Date(value);
    return Number.isNaN(date.getTime()) ? '' : date.toLocaleString();
  }

  function statusActionMarkup(order) {
    const actions = {
      pending: ['preparing', 'Start Preparing'],
      preparing: ['ready', 'Mark Ready'],
      ready: ['completed', 'Complete Order']
    };
    const action = actions[String(order.status || 'pending').trim().toLowerCase()];
    if (!action) return '';

    return `<div class="order-actions">
      <button type="button" class="status-action"
        data-order-status-action="${action[0]}"
        data-order-id="${escapeHtml(order.id)}">${action[1]}</button>
    </div>`;
  }
  async function loadOrders() {
    if (!token || !slug) {
      message.textContent = 'Please sign in to the admin panel and select a restaurant first.';
      ordersContainer.replaceChildren();
      return;
    }

    if (!sessionStorage.getItem('orderBranchId')) { message.textContent = 'Select a branch to view its orders.'; ordersContainer.replaceChildren(); return; }
    message.textContent = 'Loading orders...';

    try {
      const response = await fetch(
        `/api/admin/orders/${encodeURIComponent(slug)}` + (sessionStorage.getItem('orderBranchId') ? '?branch_id=' + encodeURIComponent(sessionStorage.getItem('orderBranchId')) : ''),
        { headers: { Authorization: `Bearer ${token}` }, cache: 'no-store' }
      );
      const data = await response.json();

      if (!response.ok || data?.ok !== true) {
        throw new Error(data?.message || 'Unable to load orders.');
      }

      document.getElementById('restaurantName').textContent = data.restaurant.name;
      const statusOrder = { pending: 0, preparing: 1, ready: 2, completed: 3 };
      const orders = (Array.isArray(data.orders) ? [...data.orders] : []).sort((a, b) => {
        const statusA = String(a.status || 'pending').toLowerCase();
        const statusB = String(b.status || 'pending').toLowerCase();
        const groupDifference = (statusOrder[statusA] ?? 4) - (statusOrder[statusB] ?? 4);
        if (groupDifference) return groupDifference;

        const timestamp = order => {
          const status = String(order.status || 'pending').toLowerCase();
          const value = status === 'preparing' ? (order.preparing_at || order.created_at) :
            status === 'ready' ? (order.ready_at || order.preparing_at || order.created_at) :
            status === 'completed' ? (order.completed_at || order.ready_at || order.created_at) :
            order.created_at;
          return Date.parse(value || '') || 0;
        };

        const timeA = timestamp(a);
        const timeB = timestamp(b);
        return statusA === 'completed'
          ? (timeB - timeA || (Number(b.id) || 0) - (Number(a.id) || 0))
          : (timeA - timeB || (Number(a.id) || 0) - (Number(b.id) || 0));
      });

      if (!orders.length) {
        message.textContent = 'No orders have been placed yet.';
        ordersContainer.innerHTML = '<div class="empty">New customer orders will appear here.</div>';
        return;
      }

      message.textContent = `${orders.length} recent order(s).`;
      ordersContainer.innerHTML = orders.map(order => {
        const items = Array.isArray(order.items) ? order.items : [];
        const itemMarkup = items.map(item => {
          const qty = Number(item.quantity ?? item.qty) || 1;
          const price = Number(item.price ?? item.unit_price) || 0;
          const fmt = n => (Math.round(n * 100) / 100) + ' ETB';
          return `
          <li style="list-style:none;padding:0 0 8px 0;">
            <div style="display:flex;justify-content:space-between;gap:12px;"><span>${escapeHtml(item.name)}</span><span>${fmt(price * qty)}</span></div>
            <div class="muted" style="font-size:13px;">Qty: ${qty} - ${fmt(price)} each</div>
            ${item.note ? `<div class="muted" style="font-size:13px;">Note: ${escapeHtml(item.note)}</div>` : ''}
          </li>`;
        }).join('');

        return `
          <article class="order">
            <div class="order-head">
              <strong>Order #${escapeHtml(order.display_number ?? order.id)}</strong>
              <span class="status">${escapeHtml(order.status)}</span>
            </div>
            <p class="muted">${escapeHtml(formatDate(order.created_at))}</p>
            <p><strong>Customer:</strong> ${escapeHtml(order.customer_name)}</p>
            <p><strong>Phone:</strong> ${escapeHtml(order.customer_phone)}</p>
            <p><strong>Branch:</strong> ${escapeHtml(order.branch_name)}</p>
            <p><strong>Order type:</strong> ${escapeHtml(order.order_type)}</p>
            ${order.table_number ? `<p><strong>Table:</strong> ${escapeHtml(order.table_number)}</p>` : ''}
            ${order.customer_address ? `<p><strong>Address:</strong> ${escapeHtml(order.customer_address)}</p>` : ''}
            <strong>Items</strong>
            <ul class="items">${itemMarkup}</ul>
            <h3>Total: ${escapeHtml(order.total)} ETB</h3>
            
${statusActionMarkup(order)}
            
${deleteButtonMarkup(order)}
          </article>
        `;
      }).join('');
    } catch (error) {
      message.textContent = error.message || 'Unable to load orders.';
      ordersContainer.replaceChildren();
    }
  }

  ordersContainer.addEventListener('click', async event => {
    const button = event.target.closest('button[data-order-status-action]');
    if (!button || !ordersContainer.contains(button)) return;

    button.disabled = true;
    message.textContent = 'Updating order status...';

    try {
      const response = await fetch(
        `/api/admin/orders/${encodeURIComponent(slug)}/${encodeURIComponent(button.dataset.orderId)}/status`,
        {
          method: 'PATCH',
          headers: {
            Authorization: `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
          cache: 'no-store',
          body: JSON.stringify({ status: button.dataset.orderStatusAction })
        }
      );

      const data = await response.json();
      if (!response.ok) {
        throw new Error(data.message || 'Unable to update order status.');
      }

      await loadOrders();
      message.textContent = data.message || 'Order status updated.';
    } catch (error) {
      message.textContent = error.message || 'Unable to update order status.';
      button.disabled = false;
    }
  });
  document.getElementById('refreshButton').addEventListener('click', loadOrders);
// ---- Real-time orders ----
try {
  const liveSlug = (typeof slug !== 'undefined' && slug) ? slug : '';
  if (liveSlug && window.EventSource) {
    let liveTimer = null;
    const liveReload = () => { clearTimeout(liveTimer); liveTimer = setTimeout(() => { loadOrders(); }, 300); };
    const liveStream = new EventSource('/api/orders-stream/' + encodeURIComponent(liveSlug));
    liveStream.addEventListener('orders', liveReload);
    setInterval(() => { if (!document.hidden) loadOrders(); }, 30000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) loadOrders(); });
  }
} catch (e) { console.error('Real-time setup failed:', e); }
// ---- Admin tools: menu, order history, customers, delete ----
function deleteButtonMarkup(order) {
  return `<div class="order-actions"><button type="button" class="admin-delete-btn" data-delete-order="${escapeHtml(order.id)}" data-order-number="${escapeHtml(order.display_number ?? order.id)}">&#128465; Delete order</button></div>`;
}
const adminMenuButton = document.getElementById('adminMenuButton');
const adminMenu = document.getElementById('adminMenu');
const adminOverlay = document.getElementById('adminOverlay');
const adminOverlayTitle = document.getElementById('adminOverlayTitle');
const adminOverlayBody = document.getElementById('adminOverlayBody');
let adminView = 'live';
let historyDate = '';
let customerCache = [];
let customerSearch = '';
let currentCustomer = null;

async function adminRequest(url, options) {
  const opts = options || {};
  const response = await fetch(url, Object.assign({ cache: 'no-store' }, opts, {
    headers: Object.assign({ Authorization: `Bearer ${token}` }, opts.headers || {})
  }));
  const data = await response.json().catch(() => ({}));
  if (!response.ok || data.ok !== true) throw new Error(data.message || 'Request failed.');
  return data;
}
function pad2(n) { return String(n).padStart(2, '0'); }
function todayString() { const d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function shiftDate(value, days) {
  const p = value.split('-').map(Number);
  const d = new Date(p[0], p[1] - 1, p[2] + days);
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}
function formatMoney(value) { return (Math.round((Number(value) || 0) * 100) / 100) + ' ETB'; }

function historyOrderMarkup(order) {
  const items = Array.isArray(order.items) ? order.items : [];
  const itemsHtml = items.map(item => {
    const qty = Number(item.quantity ?? item.qty) || 1;
    const price = Number(item.price ?? item.unit_price) || 0;
    return `<li><div class="admin-item-row"><span>${escapeHtml(item.name)}</span><span>${formatMoney(price * qty)}</span></div>
      <div class="muted admin-item-sub">Qty: ${qty} - ${formatMoney(price)} each</div>
      ${item.note ? `<div class="muted admin-item-sub">Note: ${escapeHtml(item.note)}</div>` : ''}</li>`;
  }).join('');
  return `<article class="order">
    <div class="order-head"><strong>Order #${escapeHtml(order.display_number ?? order.id)}</strong><span class="status">${escapeHtml(order.status)}</span></div>
    <p class="muted">${escapeHtml(formatDate(order.created_at))}</p>
    <p><strong>Customer:</strong> ${escapeHtml(order.customer_name)}${order.customer_phone ? ' - ' + escapeHtml(order.customer_phone) : ''}</p>
    <p><strong>Branch:</strong> ${escapeHtml(order.branch_name)} - ${escapeHtml(order.order_type)}${order.table_number ? ' - Table ' + escapeHtml(order.table_number) : ''}</p>
    ${order.customer_address ? `<p><strong>Address:</strong> ${escapeHtml(order.customer_address)}</p>` : ''}
    <ul class="admin-item-list">${itemsHtml}</ul>
    <h3>Total: ${formatMoney(order.total)}</h3>
    ${deleteButtonMarkup(order)}
  </article>`;
}

function openOverlay() { adminOverlay.hidden = false; document.body.style.overflow = 'hidden'; }
function closeOverlay() { adminOverlay.hidden = true; document.body.style.overflow = ''; adminView = 'live'; loadOrders(); }
function setMenu(open) { adminMenu.hidden = !open; adminMenuButton.setAttribute('aria-expanded', open ? 'true' : 'false'); }

async function showHistory() {
  adminView = 'history';
  adminOverlayTitle.textContent = 'Order History';
  if (!historyDate) historyDate = todayString();
  adminOverlayBody.innerHTML = `<div class="admin-date-bar">
      <button type="button" data-history-shift="-1" aria-label="Previous day">&#8249;</button>
      <input type="date" id="historyDateInput" value="${historyDate}">
      <button type="button" data-history-shift="1" aria-label="Next day">&#8250;</button>
      <button type="button" data-history-today>Today</button>
    </div>
    <div id="historyResult"><p class="muted">Loading...</p></div>`;
  await loadHistory();
}
async function loadHistory() {
  const box = document.getElementById('historyResult');
  if (!box) return;
  box.innerHTML = '<p class="muted">Loading...</p>';
  try {
    const data = await adminRequest(`/api/admin/order-history/${encodeURIComponent(slug)}?date=${encodeURIComponent(historyDate)}`);
    if (adminView !== 'history') return;
    const orders = data.orders || [];
    if (!orders.length) { box.innerHTML = '<div class="empty">No orders on this day.</div>'; return; }
    const counts = { pending: 0, preparing: 0, ready: 0, completed: 0 };
    let total = 0;
    orders.forEach(o => {
      const s = String(o.status || 'pending').toLowerCase();
      if (s in counts) counts[s]++;
      total += Number(o.total) || 0;
    });
    box.innerHTML = `<div class="admin-summary"><strong>${orders.length}</strong> order(s) &middot; <strong>${formatMoney(total)}</strong> total
        <div class="muted">Pending ${counts.pending} &middot; Preparing ${counts.preparing} &middot; Ready ${counts.ready} &middot; Completed ${counts.completed}</div></div>`
      + orders.map(historyOrderMarkup).join('');
  } catch (e) { box.innerHTML = `<p class="muted">${escapeHtml(e.message || 'Unable to load history.')}</p>`; }
}

async function showCustomers() {
  adminView = 'customers';
  currentCustomer = null;
  adminOverlayTitle.textContent = 'Customers';
  adminOverlayBody.innerHTML = `<input type="search" id="customerSearchInput" class="admin-search" placeholder="Search name, phone or address" value="${escapeHtml(customerSearch)}"><div id="customerResult"><p class="muted">Loading...</p></div>`;
  try {
    const data = await adminRequest(`/api/admin/customers/${encodeURIComponent(slug)}`);
    if (adminView !== 'customers') return;
    customerCache = data.customers || [];
    renderCustomers();
  } catch (e) {
    const box = document.getElementById('customerResult');
    if (box) box.innerHTML = `<p class="muted">${escapeHtml(e.message || 'Unable to load customers.')}</p>`;
  }
}
function renderCustomers() {
  const box = document.getElementById('customerResult');
  if (!box) return;
  const q = customerSearch.trim().toLowerCase();
  const list = customerCache.filter(c => !q || [c.name, c.phone, c.address].join(' ').toLowerCase().includes(q));
  if (!list.length) { box.innerHTML = '<div class="empty">No customers found.</div>'; return; }
  box.innerHTML = `<p class="muted">${list.length} customer(s)</p>` + list.map(c => `
    <article class="order admin-customer">
      <div class="admin-customer-main">
        <strong>${escapeHtml(c.name || 'Unknown')}</strong>
        <div>${escapeHtml(c.phone || 'No phone')}</div>
        <div class="muted">${escapeHtml(c.address || 'No address')}</div>
        <div class="muted">${escapeHtml(c.order_count)} order(s) &middot; ${formatMoney(c.total_spent)}</div>
      </div>
      <button type="button" class="admin-detail-btn" data-customer-key="${escapeHtml(c.customer_key)}" data-customer-name="${escapeHtml(c.name || '')}">Details</button>
    </article>`).join('');
}
async function showCustomerOrders(key, name) {
  adminView = 'customer-detail';
  currentCustomer = { key: key, name: name };
  adminOverlayTitle.textContent = (name || 'Customer') + ' - Orders';
  adminOverlayBody.innerHTML = `<div class="admin-date-bar"><button type="button" data-customer-back>&#8249; Back to customers</button></div><div id="customerOrdersResult"><p class="muted">Loading...</p></div>`;
  const box = document.getElementById('customerOrdersResult');
  try {
    const data = await adminRequest(`/api/admin/customers/${encodeURIComponent(slug)}/orders?key=${encodeURIComponent(key)}`);
    if (adminView !== 'customer-detail') return;
    const orders = data.orders || [];
    if (!orders.length) { box.innerHTML = '<div class="empty">No orders for this customer.</div>'; return; }
    const total = orders.reduce((sum, o) => sum + (Number(o.total) || 0), 0);
    box.innerHTML = `<div class="admin-summary"><strong>${orders.length}</strong> order(s) &middot; <strong>${formatMoney(total)}</strong> total</div>` + orders.map(historyOrderMarkup).join('');
  } catch (e) { box.innerHTML = `<p class="muted">${escapeHtml(e.message || 'Unable to load orders.')}</p>`; }
}

async function deleteOrder(id, number) {
  if (!window.confirm(`Delete order #${number}? This cannot be undone.`)) return;
  try {
    await adminRequest(`/api/admin/orders/${encodeURIComponent(slug)}/${encodeURIComponent(id)}`, { method: 'DELETE' });
    await loadOrders();
    message.textContent = `Order #${number} deleted.`;
    if (!adminOverlay.hidden) {
      if (adminView === 'history') await loadHistory();
      else if (adminView === 'customer-detail' && currentCustomer) await showCustomerOrders(currentCustomer.key, currentCustomer.name);
    }
  } catch (e) { window.alert(e.message || 'Unable to delete the order.'); }
}

adminMenuButton.addEventListener('click', e => { e.stopPropagation(); setMenu(adminMenu.hidden); });
document.addEventListener('click', e => { if (!adminMenu.hidden && !adminMenu.contains(e.target)) setMenu(false); });
adminMenu.addEventListener('click', e => {
  const b = e.target.closest('button[data-admin-view]');
  if (!b) return;
  setMenu(false);
  const view = b.dataset.adminView;
  if (view === 'live') { if (!adminOverlay.hidden) closeOverlay(); return; }
  openOverlay();
  if (view === 'history') showHistory(); else showCustomers();
});
document.getElementById('adminOverlayClose').addEventListener('click', closeOverlay);
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!adminMenu.hidden) setMenu(false); else if (!adminOverlay.hidden) closeOverlay();
});
ordersContainer.addEventListener('click', e => {
  const del = e.target.closest('button[data-delete-order]');
  if (del) deleteOrder(del.dataset.deleteOrder, del.dataset.orderNumber);
});
adminOverlay.addEventListener('click', e => {
  const del = e.target.closest('button[data-delete-order]');
  if (del) { deleteOrder(del.dataset.deleteOrder, del.dataset.orderNumber); return; }
  const shift = e.target.closest('button[data-history-shift]');
  if (shift) {
    historyDate = shiftDate(historyDate || todayString(), Number(shift.dataset.historyShift));
    const input = document.getElementById('historyDateInput'); if (input) input.value = historyDate;
    loadHistory(); return;
  }
  if (e.target.closest('button[data-history-today]')) {
    historyDate = todayString();
    const input = document.getElementById('historyDateInput'); if (input) input.value = historyDate;
    loadHistory(); return;
  }
  const detail = e.target.closest('button[data-customer-key]');
  if (detail) { showCustomerOrders(detail.dataset.customerKey, detail.dataset.customerName); return; }
  if (e.target.closest('button[data-customer-back]')) showCustomers();
});
adminOverlay.addEventListener('change', e => {
  if (e.target.id === 'historyDateInput' && e.target.value) { historyDate = e.target.value; loadHistory(); }
});
adminOverlay.addEventListener('input', e => {
  if (e.target.id === 'customerSearchInput') { customerSearch = e.target.value; renderCustomers(); }
});
  loadOrders();
})();
</script>
<script>
(function () {
  const filters = document.querySelectorAll(".order-filter");
  const orders = document.getElementById("orders");
  if (!orders || !filters.length) return;

  const filterStorageKey = "caffemenu-order-filter:" + location.pathname;
  let activeFilter = "pending";

  try {
    const savedFilter = localStorage.getItem(filterStorageKey);
    if (["all", "pending", "preparing", "ready", "completed"].includes(savedFilter)) {
      activeFilter = savedFilter;
    }
  } catch (_) {}

  function statusGroup(card) {
    const statusNode = card.querySelector(".status");
    const status = (statusNode ? statusNode.textContent : "")
      .trim().toLowerCase().replace(/[\s-]+/g, "_");

    if (status === "pending") {
      return "pending";
    }

    if (["preparing", "in_progress", "processing", "cooking"].includes(status)) {
      return "preparing";
    }

    if (["ready", "prepared"].includes(status)) {
      return "ready";
    }

    if (["completed", "complete", "delivered", "served", "done"].includes(status)) {
      return "completed";
    }

    return "other";
  }

  function updateFilters() {
    const cards = Array.from(orders.querySelectorAll(".order"));

    const counts = { pending: 0, preparing: 0, ready: 0, completed: 0 };

    cards.forEach(card => {
      const group = statusGroup(card);
      if (Object.prototype.hasOwnProperty.call(counts, group)) {
        counts[group]++;
      }

      card.hidden = activeFilter !== "all" && group !== activeFilter;
    });

    filters.forEach(button => {
      const group = button.dataset.filter;
      const count = button.querySelector("[data-count]");
      if (count) count.textContent = String(counts[group] || 0);
      button.setAttribute("aria-pressed", String(activeFilter === group));
    });
  }

  filters.forEach(button => {
    button.addEventListener("click", function () {
      activeFilter = button.dataset.filter;
      try {
        localStorage.setItem(filterStorageKey, activeFilter);
      } catch (_) {}
      updateFilters();
    });
  });

  new MutationObserver(updateFilters).observe(orders, {
    childList: true,
    subtree: true,
    characterData: true
  });

  updateFilters();
})();
</script>
