<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Super Admin Dashboard - Caffe Menu</title>

<link rel="stylesheet" href="stylesheets/super-admin.css">


</head>

<body>

<div id="ownerTopNotification" class="owner-top-notification">

    <div class="owner-notification-content">

        <div
            id="ownerNotificationIcon"
            class="owner-notification-icon"
        >
            ✓
        </div>

        <div class="owner-notification-text">

            <div
                id="ownerNotificationTitle"
                class="owner-notification-title"
            >
                Success
            </div>

            <div
                id="ownerNotificationMessage"
                class="owner-notification-message"
            ></div>

        </div>

        <button
            class="owner-notification-close"
            onclick="closeOwnerNotification()"
            type="button"
        >
            ✕
        </button>

    </div>

</div>


<!-- =========================================================
     SUPER ADMIN ACTION PANEL
========================================================== -->

<div id="ownerActionPanel" class="owner-action-panel">

    <div class="owner-action-header">

        <h3 id="ownerActionTitle">
            Restaurant Action
        </h3>

        <button
            class="owner-action-close"
            onclick="closeOwnerActionPanel()"
            type="button"
        >
            ✕
        </button>

    </div>

    <div id="ownerActionContent"></div>

</div>


<!-- =========================================================
     SUPER ADMIN APP
========================================================== -->

<main class="super-admin-app">

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="super-admin-header">

        <div class="header-left">

            <button
                id="ownerRefreshBtn"
                class="header-icon-btn"
                onclick="refreshOwnerDashboard()"
                title="Refresh Dashboard"
                type="button"
            >
                ↻
            </button>

        </div>


        <div class="dashboard-intro">
            <h1>Super Admin Dashboard</h1>
        </div>


        <div class="header-right">

            <div class="header-actions">

    <button
        type="button"
        class="menu-toggle"
        id="superAdminMenuToggle"
        aria-label="Open menu">
        ☰
    </button>

    <div class="super-admin-menu" id="superAdminMenu">

    <button
        type="button"
        onclick="openCreateCafePanel();">
        <span>＋</span>
        Create New
    </button>

    <button
        type="button"
        onclick="openCompanyProfile();">
        <span>⚙</span>
        Edit Company Profile
    </button>

    <div class="menu-divider"></div>

        <button type="button" class="menu-logout" onclick="logoutAdmin(); closeSuperAdminMenu();">
            <span>↪</span>
            Log Out
        </button>

</div>

</div>

        </div>

    </header>


    <!-- =====================================================
         PAGE INTRO
    ====================================================== -->


    <!-- =====================================================
         RESTAURANT STATISTICS
    ====================================================== -->

    <section class="restaurant-stats">


        <!-- TOTAL -->

        <button
            type="button"
            class="stat-card stat-filter active-filter"
            onclick="filterOwnerRestaurants('all')"
        >

            <div class="stat-icon total-icon">
                🏪
            </div>

            <div class="stat-content">

                <div class="stat-label">
                    Total Restaurants
                </div>

                <div
                    id="totalRestaurants"
                    class="stat-number"
                >
                    0
                </div>

                <div class="stat-description">
                    All restaurants
                </div>

            </div>

        </button>


        <!-- ACTIVE -->

        <button
            type="button"
            class="stat-card stat-filter active-stat"
            onclick="filterOwnerRestaurants('active')"
        >

            <div class="stat-icon active-icon">
                ✓
            </div>

            <div class="stat-content">

                <div class="stat-label">
                    Active Restaurants
                </div>

                <div
                    id="activeRestaurants"
                    class="stat-number"
                >
                    0
                </div>

                <div class="stat-description">
                    Currently active
                </div>

            </div>

        </button>


        <!-- DISABLED -->

        <button
            type="button"
            class="stat-card stat-filter disabled-stat"
            onclick="filterOwnerRestaurants('disabled')"
        >

            <div class="stat-icon disabled-icon">
                ⏸
            </div>

            <div class="stat-content">

                <div class="stat-label">
                    Disabled Restaurants
                </div>

                <div
                    id="disabledRestaurants"
                    class="stat-number"
                >
                    0
                </div>

                <div class="stat-description">
                    Currently disabled
                </div>

            </div>

        </button>


    </section>


    <!-- =====================================================
         RESTAURANT MANAGEMENT
    ====================================================== -->

    <section class="restaurant-management">


        <div class="dashboard-section-heading">

            <div>

                <span class="section-eyebrow">
                    PLATFORM
                </span>

                <h2>
                    Restaurant Management
                </h2>

                <p>
                    Manage and monitor all restaurants registered
                    on your platform.
                </p>

            </div>


            <button
                class="management-refresh-btn"
                onclick="loadOwnerCafes()"
                type="button"
            >
                <span>↻</span>
                Refresh
            </button>

        </div>


        <!-- SEARCH -->

        <div class="restaurant-toolbar">

            <div class="restaurant-search-bar">

                <span class="search-icon">
                    ⌕
                </span>

                <input
                    type="text"
                    id="restaurantSearch"
                    placeholder="Search restaurant..."
                    autocomplete="off"
                >

                <button
                    type="button"
                    class="search-clear"
                    id="restaurantSearchClear"
                    title="Clear search"
                >
                    ✕
                </button>

            </div>

        </div>


        <!-- TABLE -->

        <div class="restaurant-table">

            <!-- TABLE HEADER -->

            <div class="restaurant-table-header">

                <div>
                    Restaurant
                </div>

                <div>
                    Slug
                </div>

                <div>
                    Status
                </div>

                <div>
                    Access
                </div>

            </div>


            <!-- RESTAURANT LIST -->

            <div
                id="ownerCafeList"
                class="owner-cafe-list"
            >
                Loading cafés...
            </div>

        </div>


        <!-- EMPTY / STATUS MESSAGE -->

        <div
            id="ownerDashboardMessage"
            class="owner-dashboard-message"
        ></div>


    </section>


    <!-- =====================================================
         FOOTER CONTROLS
    ====================================================== -->

    <footer class="super-admin-footer">

        <div class="footer-info">

            <span class="footer-status-dot"></span>

            <span>
                Super Admin Control Center
            </span>

        </div>

    </footer>


</main>


<!-- =========================================================
     JAVASCRIPT
========================================================== -->

<script src="/scripts/super-admin.js"></script>

</body>

</html>
