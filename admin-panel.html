<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Restaurant Admin Panel</title>

<link rel="stylesheet" href="stylesheets/admin-panel.css">
<link rel="stylesheet" href="stylesheets/save.css">

</head>

<body>

<div id="pageLoading">
    Checking login...
</div>

<div class="dashboard-page">


<div class="admin-panel-box">

    <!-- =========================================================
         HEADER
    ========================================================== -->

    <header class="admin-header">

        <div class="restaurant-name">
            <span id="restaurantName">
                Restaurant Admin Panel
            </span>
        </div>

        <div class="admin-actions">

            <button
                type="button"
                id="adminRefreshBtn"
                class="refresh-btn"
            >
                ↻ Refresh
            </button>

            <button
                type="button"
                id="profileBtn"
                class="profile-btn"
            >
                👤 Profile
            </button>

            <button
                type="button"
                id="daySpecialBtn"
                class="day-special-btn"
            >
                ⭐ Day Special
            </button>

            <button
                type="button"
                id="logoutBtn"
                class="logout-btn"
            >
                🚪 Logout
            </button>

        </div>

    </header>


    <!-- =========================================================
         ADD CATEGORY
    ========================================================== -->

    <div class="section">

        <h3>
            Add Category
        </h3>

        <div class="form-row">

            <input
                id="newCategoryName"
                placeholder="Category name"
            >

            <button
                type="button"
                class="admin-btn"
                onclick="addCategoryFromUI()"
            >
                Add Category
            </button>

        </div>

    </div>


    <!-- =========================================================
         MANAGE CATEGORIES
    ========================================================== -->

    <div class="section">

        <h3>
            Manage Categories
        </h3>

        <div class="form-row">

            <select
                id="existingCategorySelect"
                onchange="populateSelectedCategory()"
            >

                <option value="">
                    Select category
                </option>

            </select>

            <input
                type="text"
                id="editCategoryName"
                placeholder="New category name"
            >

            <button
                type="button"
                class="admin-btn"
                onclick="updateSelectedCategory()"
            >
                Update Category Name
            </button>

        </div>

    </div>


    <!-- =========================================================
         ADD ITEM
    ========================================================== -->

    <div class="section">

        <h3>
            Add Item
        </h3>

        <div class="form-row">

            <input
                id="newItemName"
                placeholder="Item name"
            >

            <input
                id="newItemPrice"
                placeholder="Price"
                type="number"
                step="0.01"
            >

            <input
                id="newItemImage"
                type="file"
                accept="image/*"
            >

            <input
                id="newItemIngredient"
                placeholder="Ingredient"
            >

            <label class="checkbox-label">

                <input
                    id="newItemAvailable"
                    type="checkbox"
                    checked
                >

                Available

            </label>

            <select id="newItemCategory">

                <option value="">
                    Select category
                </option>

            </select>

        </div>

        <button
            type="button"
            class="admin-btn"
            onclick="addItemFromUI()"
        >
            Add Item
        </button>

    </div>


    <!-- =========================================================
         UPDATE / DELETE ITEM
    ========================================================== -->

    <div class="section">

        <h3>
            Update / Delete Item
        </h3>


        <div class="item-selection-box">

            <div class="selection-field">

                <label for="existingItemCategorySelect">
                    1. Choose Category
                </label>

                <select
                    id="existingItemCategorySelect"
                    onchange="updateExistingItemsByCategory()"
                >

                    <option value="">
                        Select category
                    </option>

                </select>

            </div>


            <div class="selection-field">

                <label for="existingItemSelect">
                    2. Choose Item
                </label>

                <select
                    id="existingItemSelect"
                    onchange="populateSelectedItemFields()"
                    disabled
                >

                    <option value="">
                        Select category first
                    </option>

                </select>

            </div>

        </div>


        <div class="form-row edit-fields">

            <input
                id="editItemName"
                placeholder="Item name"
            >

            <input
                id="editItemPrice"
                placeholder="Price"
                type="number"
                step="0.01"
            >

            <input
                id="editItemIngredient"
                placeholder="Ingredient"
            >

            <select id="editItemCategory">

                <option value="">
                    Select category
                </option>

            </select>

            <label class="checkbox-label">

                <input
                    id="editItemAvailable"
                    type="checkbox"
                >

                Available

            </label>

        </div>


        <div class="button-row">

            <button
                type="button"
                class="admin-btn"
                onclick="updateSelectedItem()"
            >
                Update Item
            </button>

            <button
                type="button"
                class="admin-btn danger-btn"
                onclick="deleteSelectedItem()"
            >
                Delete Item
            </button>

        </div>

    </div>


    <!-- =========================================================
         SAVE
    ========================================================== -->

    <div class="section save-section">

        <button
            type="button"
            class="admin-btn save-menu-btn"
            onclick="saveMenuToServer()"
        >
            Save Menu
        </button>

    </div>


    <!-- =========================================================
         MESSAGE
    ========================================================== -->

    <div id="message"></div>


    <!-- =========================================================
         CURRENT MENU
    ========================================================== -->

    <div class="section">

        <h3>
            Current Menu
        </h3>

        <div
            id="menuList"
            class="menu-list"
        >
            Loading menu...
        </div>

    </div>

</div>


</div>

<!-- ================================================================
     PROFILE MODAL
================================================================ -->

<div
    id="profileModal"
    class="profile-modal-overlay"
>


<div
    class="profile-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="profileModalTitle"
>


    <!-- PROFILE HEADER -->

    <div class="profile-modal-header">

        <div class="profile-modal-title-area">

            <div class="profile-title-icon">
                👤
            </div>

            <div>

                <h2 id="profileModalTitle">
                    Café Profile
                </h2>

                <p id="profileRestaurantName">
                    Restaurant information
                </p>

            </div>

        </div>


        <button
            type="button"
            id="profileCloseBtn"
            class="profile-close-btn"
            aria-label="Close profile"
        >
            ×
        </button>

    </div>


    <!-- PROFILE BODY -->

    <div class="profile-modal-body">


        <!-- PHONE NUMBERS -->

        <div class="profile-section">

            <div class="profile-section-header">

                <div>

                    <div class="profile-section-title">
                        📞 Phone Numbers
                    </div>

                    <div class="profile-section-description">
                        Customers can tap a number to call your café.
                    </div>

                </div>

                <button
                    type="button"
                    id="addPhoneBtn"
                    class="profile-add-btn"
                >
                    + Add Phone
                </button>

            </div>


            <div
                id="phoneList"
                class="profile-list"
            >
            </div>

        </div>


        <!-- LOCATIONS -->

        <div class="profile-section">

            <div class="profile-section-header">

                <div>

                    <div class="profile-section-title">
                        📍 Locations
                    </div>

                    <div class="profile-section-description">
                        Add a branch name and its map link.
                    </div>

                </div>

                <button
                    type="button"
                    id="addLocationBtn"
                    class="profile-add-btn"
                >
                    + Add Location
                </button>

            </div>


            <div
                id="locationList"
                class="profile-list"
            >
            </div>

        </div>

    </div>


    <!-- PROFILE FOOTER -->

    <div class="profile-modal-footer">

        <button
            type="button"
            id="profileCancelBtn"
            class="profile-cancel-btn"
        >
            Cancel
        </button>

        <button
            type="button"
            id="profileSaveBtn"
            class="profile-save-btn"
        >
            Save Profile
        </button>

    </div>

</div>

</div>

<script src="/scripts/admin.js"></script>

</body>

</html>
