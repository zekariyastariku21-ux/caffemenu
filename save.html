<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cafe Menu</title>
  <link rel="stylesheet" href="stylesheets/save.css">
  <link rel="stylesheet" href="stylesheets/day-special.css">
</head>

<body>

  <!-- PROFESSIONAL SUPER ADMIN NOTIFICATION -->
  <div id="ownerTopNotification" class="owner-top-notification">
    <div class="owner-notification-content">

      <div id="ownerNotificationIcon" class="owner-notification-icon">
        ✓
      </div>

      <div class="owner-notification-text">
        <div id="ownerNotificationTitle" class="owner-notification-title">
          Success
        </div>

        <div
          id="ownerNotificationMessage"
          class="owner-notification-message"
        ></div>
      </div>

      <button
        class="owner-notification-close"
        onclick="closeOwnerNotification()"
      >
        ✕
      </button>

    </div>
  </div>


  <!-- PROFESSIONAL SUPER ADMIN ACTION PANEL -->
  <div id="ownerActionPanel" class="owner-action-panel">

    <div class="owner-action-header">

      <h3 id="ownerActionTitle">
        Restaurant Action
      </h3>

      <button
        class="owner-action-close"
        onclick="closeOwnerActionPanel()"
      >
        ✕
      </button>

    </div>

    <div id="ownerActionContent"></div>

  </div>


  <!-- IMAGE VIEWER -->
  <div id="imageViewer" class="image-viewer">

    <button
      class="close-image"
      onclick="closeImage()"
    >
      ✕
    </button>

    <img
      id="bigImage"
      alt="Menu item"
    >

  </div>


  <!-- PAYMENT MODAL -->
  <div
    id="paymentModal"
    class="payment-overlay"
    role="dialog"
    aria-modal="true"
    aria-labelledby="paymentTitle"
  >

    <div class="payment-card">

      <button
        class="payment-close"
        type="button"
        onclick="closePaymentModal()"
        aria-label="Close payment options"
      >
        &times;
      </button>

      <h2 id="paymentTitle">
        Choose a payment method
      </h2>

      <p class="payment-total">
        Total to pay:
        <strong id="payment-total">
          0 <span class="notranslate" translate="no">ETB</span>
        </strong>
      </p>

      <div
        class="payment-options"
        role="group"
        aria-label="Payment methods"
      >

        <button
          type="button"
          class="payment-option selected"
          data-method="Telebirr"
        >
          Telebirr
        </button>

        <button
          type="button"
          class="payment-option"
          data-method="CBE Contactless"
        >
          CBE Tap
        </button>

        <button
          type="button"
          class="payment-option"
          data-method="BOA"
        >
          BOA
        </button>

      </div>

      <form
        id="telebirrPaymentForm"
        class="payment-form"
      >

        <label for="telebirrAccount">
          Telebirr account number
        </label>

        <input
          id="telebirrAccount"
          name="telebirrAccount"
          type="tel"
          inputmode="tel"
          autocomplete="tel"
          placeholder="09XXXXXXXX"
          required
        >

        <button
          type="submit"
          class="payment-submit"
        >
          Pay with Telebirr
        </button>

      </form>

      <p
        id="paymentMessage"
        class="payment-message"
        aria-live="polite"
      ></p>

    </div>

  </div>


  <!-- CUSTOMER RESTAURANT HEADER -->
  <header class="menu-profile-header">

    <div class="menu-brand-row">

      <div class="menu-profile-image">

        <img id="restaurantLogo" src="" alt="Restaurant">

      </div>


      <div class="menu-brand-info">

        <h1 id="restaurantName" aria-busy="true">
          Loading...
        </h1>


        <!--
          Customer contact information is populated
          automatically from the restaurant profile.
        -->
        <div
          id="restaurantContactRow"
          class="menu-contact-row"
        ></div>

      </div>

      <div class="customer-language-control" id="customerLanguageControl">
        <button
          type="button"
          class="customer-language-toggle"
          id="customerLanguageToggle"
          aria-label="Choose menu language"
          aria-haspopup="menu"
          aria-expanded="false"
          aria-controls="customerLanguageMenu"
        >
          <span class="customer-language-icon" aria-hidden="true">文</span>
          <span
            class="customer-language-current notranslate"
            id="customerLanguageLabel"
            translate="no"
          >English</span>
          <span class="customer-language-chevron" aria-hidden="true"></span>
        </button>

        <div
          class="customer-language-menu"
          id="customerLanguageMenu"
          role="menu"
          aria-label="Choose menu language"
          hidden
        >
          <button type="button" role="menuitemradio" aria-checked="true" data-language-option="en">
            <span class="customer-language-name notranslate" translate="no">English</span>
            <span class="customer-language-code notranslate" translate="no" aria-hidden="true">EN</span>
          </button>
          <button type="button" role="menuitemradio" aria-checked="false" data-language-option="am">
            <span class="customer-language-name notranslate" translate="no">አማርኛ</span>
            <span class="customer-language-code notranslate" translate="no" aria-hidden="true">AM</span>
          </button>
          <button type="button" role="menuitemradio" aria-checked="false" data-language-option="ar">
            <span class="customer-language-name notranslate" translate="no">العربية</span>
            <span class="customer-language-code notranslate" translate="no" aria-hidden="true">AR</span>
          </button>
          <button type="button" role="menuitemradio" aria-checked="false" data-language-option="zh-CN">
            <span class="customer-language-name notranslate" translate="no">中文</span>
            <span class="customer-language-code notranslate" translate="no" aria-hidden="true">ZH</span>
          </button>
        </div>

        <select id="customerLanguage" class="customer-language-state" tabindex="-1" aria-hidden="true">
          <option value="en">English</option>
          <option value="am">አማርኛ</option>
          <option value="ar">العربية</option>
          <option value="zh-CN">中文</option>
        </select>
      </div>

    </div>

  </header>

  <div id="google_translate_element" class="customer-translation-widget" aria-hidden="true"></div>


  <!-- MAIN MENU -->
  <div class="main">

    <div class="filter-bar">

      <div class="filter-bar-top">

        <input
          id="searchInput"
          type="text"
          placeholder="Search items..."
        >

        <button
          id="daySpecialBtn"
          class="menu-day-special"
          type="button"
      >
         ✨ DAY SPECIAL ✨
      </button> 

      </div>

      <div
        class="buttons"
        id="categoryButtons"
      >
        <button>
          all item
        </button>
      </div>

    </div>


    <div class="container"></div>


    <!-- CART -->
    <div class="container2">

      <div class="cart">

        <button
          class="cart-close"
          type="button"
          aria-label="Close cart"
        >
          ×
        </button>

        <div class="cart-actions">
          <!-- Cart persists per-device via localStorage -->
        </div>

        <table>

          <thead>
            <tr>
              <th>Item</th>
              <th>Price</th>
              <th>Qty</th>
            </tr>
          </thead>

          <tbody id="cart-body"></tbody>

          <tfoot>

            <tr>

              <td>
                <strong>
                  Total price
                </strong>
              </td>

              <td
                colspan="2"
                id="total-price"
              >
                0
              </td>

            </tr>

          </tfoot>

        </table>


       <!-- <button
          class="payment"
          type="button"
        >
          Pay Now
        </button> -->

      </div>

    </div>


    <!-- CART BUTTON -->
    <div>

      <button
        class="cartbutton"
        type="button"
      >
        Cart
      </button>

    </div>

  </div>


  <script src="scripts/saveAdd.js"></script>
  <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" async></script>

</body>
</html>
